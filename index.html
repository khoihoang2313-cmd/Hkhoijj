<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UCHIHA V5 • Kích hoạt</title><style>
:root{--bg:#080a0f;--panel:rgba(20,23,31,.96);--line:#343b52;--muted:#a5b3d1;--text:#e5e7ff;--blue:#0797ff;--btn:#171c28;--green:#45d483;--red:#ff6679}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#202332 0,#0b0d13 48%,#07090d 100%);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:28px 14px 50px}.wrap{max-width:760px;margin:auto}.brand{text-align:center;font-weight:900;letter-spacing:2px;margin:14px 0 24px}.card{border:1px solid var(--line);border-radius:24px;background:var(--panel);overflow:hidden;box-shadow:0 16px 55px #0008}.head{padding:22px 20px;border-bottom:1px solid #30364a;font-size:clamp(18px,4vw,25px);font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:12px}.body{padding:20px}.field-label{display:block;color:var(--muted);margin:14px 0 9px}input,select,textarea{width:100%;background:#0c1018;border:1px solid #414963;border-radius:16px;padding:16px;color:var(--text);font-size:16px;outline:none}button{background:var(--btn);color:var(--text);border:1px solid #3d4661;border-radius:15px;padding:13px 15px;font-size:15px;cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:#1c2940;border-color:#435b86}button.blue{color:var(--blue);text-align:left}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1}.stack{display:grid;gap:10px;margin-top:10px}.status{border:1px solid #30364a;background:#0c1018;border-radius:18px;padding:17px;margin-top:18px;line-height:1.45}.muted{color:var(--muted);font-size:13px;line-height:1.5}.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;color:var(--muted);flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:14px}.keyitem{border:1px solid var(--line);border-radius:16px;padding:14px;background:#10141e;overflow-wrap:anywhere}.keytop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.pill{font-size:12px;padding:5px 9px;border-radius:99px;background:#17283a;color:#6bbcff}.revoked{background:#38202a;color:#ff8d9b}.hidden{display:none!important}h2{font-size:18px;margin:0 0 8px}hr{border:0;border-top:1px solid #30364a;margin:20px 0}
</style></head><body><main class="wrap"><div class="brand">◈ UCHIHA V5 • SECURE ACTIVATION</div><section class="card"><div class="head"><span>UCHIHA V5 API SERVER KEY</span><button onclick="clearKey()">Nhập lại</button></div><div class="body"><label class="field-label" for="key">Mã Kích Hoạt</label><input id="key" placeholder="DÁN KEY-XXXX-XXXX-XXXX" autocomplete="off"><div class="stack"><button class="blue" onclick="pasteKey()">▢ &nbsp;Dán</button><button class="blue" onclick="clearKey()">♜ &nbsp;Delete</button></div><label class="field-label" for="device" style="margin-top:24px">Mã Thiết Bị</label><input id="device" readonly><div class="stack"><button class="blue" onclick="copyDevice()">▢ &nbsp;Sao chép</button></div><div class="row"><button class="primary" onclick="checkKey()">Kiểm tra</button><button class="primary" onclick="activateKey()">Kích hoạt</button></div><div id="status" class="status">Sẵn sàng.</div><div class="foot"><span id="state">Chưa kích hoạt</span><button onclick="alert('Thay nút này bằng link liên hệ hỗ trợ của bạn.')">Liên hệ mua key</button></div><p class="muted">Bản demo. Để xác thực key an toàn và đồng bộ giữa các thiết bị, cần máy chủ.</p></div></section></main><script>
const STORE='uchiha_v5_demo_keys',DEVICE='uchiha_v5_demo_device',ACTIVE='uchiha_v5_demo_active';function getDevice(){let id=localStorage.getItem(DEVICE);if(!id){id='DEVICE-'+Array.from({length:4},()=>Math.random().toString(16).slice(2,6).toUpperCase()).join('-');localStorage.setItem(DEVICE,id)}return id}document.getElementById('device').value=getDevice();function keys(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){return []}}function msg(t,ok=false){let e=document.getElementById('status');e.textContent=t;e.style.borderColor=ok?'#2d805a':'#30364a'}function clearKey(){document.getElementById('key').value='';msg('Đã xóa nội dung.')}async function pasteKey(){try{document.getElementById('key').value=await navigator.clipboard.readText();msg('Đã dán key.')}catch(e){msg('Nhấn giữ ô nhập rồi chọn Dán.')}}async function copyDevice(){try{await navigator.clipboard.writeText(getDevice());msg('Đã sao chép mã thiết bị.',true)}catch(e){msg(getDevice())}}function checkKey(){let v=document.getElementById('key').value.trim().toUpperCase(),k=keys().find(x=>x.key===v);if(!v)return msg('Vui lòng nhập key.');if(!k)return msg('Key không tồn tại trong danh sách demo.');if(k.revoked)return msg('Key đã bị thu hồi.');if(k.expiresAt&&Date.now()>k.expiresAt)return msg('Key đã hết hạn.');let ds=k.devices||[];if(!ds.includes(getDevice())&&ds.length>=k.limit)return msg('Key đã đạt giới hạn thiết bị.');msg('Key hợp lệ. Bạn có thể kích hoạt.',true)}function activateKey(){let v=document.getElementById('key').value.trim().toUpperCase(),all=keys(),k=all.find(x=>x.key===v);if(!v)return msg('Vui lòng nhập key.');if(!k)return msg('Key không tồn tại trong danh sách demo.');if(k.revoked)return msg('Key đã bị thu hồi.');if(k.expiresAt&&Date.now()>k.expiresAt)return msg('Key đã hết hạn.');k.devices=k.devices||[];if(!k.devices.includes(getDevice())){if(k.devices.length>=k.limit)return msg('Key đã đạt giới hạn thiết bị.');k.devices.push(getDevice())}localStorage.setItem(STORE,JSON.stringify(all));localStorage.setItem(ACTIVE,v);document.getElementById('state').textContent='Đã kích hoạt';msg('Kích hoạt thành công (demo).',true)}let a=localStorage.getItem(ACTIVE);if(a){document.getElementById('key').value=a;document.getElementById('state').textContent='Đã kích hoạt trước đó (demo)'}
</script></body></html>
